; meshcore_mqtt_triangulator — example configuration
;
; Copy this file to `config.ini` and edit for your broker.
; Local config.ini is gitignored — safe place for credentials.

[mqtt]
; Hostname or IP of your MQTT broker
host = mqtt.example.com

; Port. 1883 for plain TCP, 8883 for TCP+TLS, 443 for WSS+TLS, 9001 for plain WSS
port = 8883

; Transport: "tcp" or "websockets"
transport = tcp

; Use TLS? true / false. Required if transport=websockets and port=443.
use_tls = true

; If your broker uses self-signed certs, set this to false to skip verification.
; Leave true for properly-signed certs.
tls_verify = true

; Authentication. Leave both empty for anonymous brokers.
; If your broker uses JWT in the password field, paste the token as the password.
username =
password =

; WebSocket path (only used if transport=websockets). Most brokers use /mqtt.
websocket_path = /mqtt

; Client ID for MQTT CONNECT. Leave empty for an auto-generated one.
client_id =

; Topics to subscribe to. The collector expects the standard MeshCore MQTT
; pattern where:
;   - Status topic carries each publishing radio's name + GPS + role.
;     Subscribers learn each observer's location from this topic.
;   - Packets topic carries every packet that radio's antenna received,
;     with rssi/snr/path/raw_hex.
;
; Topic patterns may use the standard MQTT wildcards (+ and #).
; The default pattern matches the de-facto standard:
;   meshcore/{IATA}/{PUBLIC_KEY}/{status,packets}
status_topic_pattern = meshcore/+/+/status
packets_topic_pattern = meshcore/+/+/packets

[storage]
; SQLite database file. Will be created if missing. Grows ~10 MB/day on a
; busy mesh, so plan disk accordingly.
db_path = ./meshcore_data.db

; Optional: prune observations older than this many days on collector start.
; Set to 0 to keep everything.
prune_older_than_days = 0

[locator]
; Maximum distance (km) between consecutive hops in a path for the chain to be
; considered physically plausible. Tighter values (35 km) reject more spurious
; chains and produce better median accuracy. Looser values (50–80 km) admit more
; chains at the cost of letting in unrealistic relay sequences.
max_rf_km = 35

; Time window the locator looks back over when triangulating a target.
; Longer windows = more data points per target, but increased risk of including
; observations from before relays moved.
days_lookback = 14

; Minimum number of distinct OBSERVERS a target must have been heard by before
; it appears in the `targets` list as a triangulation candidate.
min_observers = 2

[terrain]
; Optional terrain-aware mode. Adds line-of-sight + Fresnel-zone analysis
; using a Copernicus GLO-30 DEM. Cuts median error by ~20–50% on targets
; with at least one direct (0-hop) reception, and never hurts targets
; with no direct receptions (it falls back to plain baseline for those).
;
; To enable:
;   1. ./download_dem.py --auto      (or specify --bbox manually)
;   2. Set dem_dir below to the directory of downloaded tiles.
;
; Leave empty to run baseline-only with no terrain awareness.
dem_dir =

; Default antenna height above ground level (metres). Used for both ends of
; every link unless your DB has per-node antenna metadata. 5 m is reasonable
; for residential masts; 10–30 m matches typical repeater sites. Higher
; values classify more links as LoS but also over-credit distant links.
default_antenna_m = 5.0

; Operating frequency in MHz. 915 for AU915 / US915, 868 for EU868. The
; Fresnel zone radius scales with sqrt(λ), so the difference between AU and
; EU bands is small (< 4% on the F1 radius).
freq_mhz = 915.0
